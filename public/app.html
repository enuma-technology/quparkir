<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1d4ed8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://unpkg.com https://cdn.jsdelivr.net https://apis.google.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://api.qrserver.com https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://api.qrserver.com http://127.0.0.1:8080 http://127.0.0.1:9099 http://localhost:8080 http://localhost:9099; frame-src https://quparkir.firebaseapp.com https://accounts.google.com; worker-src 'self'; media-src 'self' blob:; base-uri 'self'; object-src 'none'" />
<title>Aplikasi QuParkir — Parkir Digital Surakarta</title>
<meta name="description" content="Aplikasi QuParkir: check-in QR, e-ticket, pembayaran cashless, dan dashboard petugas/admin." />
<meta name="robots" content="noindex" />
<link rel="canonical" href="https://quparkir.web.app/app.html" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/logo/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/logo/apple-touch-icon.png" />

<!-- OpenStreetMap / Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/app.css" />

<!-- Jalur boot didahulukan: kerangka halaman terakhir sudah bisa digambar
     begitu HTML selesai diurai, tanpa menunggu unduhan modul lain. -->
<link rel="modulepreload" href="js/boot.js" />
<link rel="modulepreload" href="js/skeleton.js" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <!-- App column -->
  <div class="app" id="app">
    <!-- Diisi js/boot.js dengan kerangka (skeleton) halaman terakhir yang
         dibuka, lalu diganti isi halaman oleh router. -->
    <div class="scroll noTab" id="view"></div>

    <!-- Bottom nav (disembunyikan di halaman login) -->
    <nav class="tabbar" id="tabbar" aria-label="Navigasi utama" hidden>
      <button data-go="#/home" class="active"><span>🏠</span><small>Home</small></button>
      <button data-go="#/riwayat"><span>🕘</span><small>Aktivitas</small></button>
      <div class="fab-slot">
        <button class="fab" id="fabScan" type="button" title="Scan &amp; Check-in" aria-label="Scan QRIS untuk check-in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <!-- bingkai pemindai -->
            <path d="M3 8.5V6a3 3 0 0 1 3-3h2.5" />
            <path d="M15.5 3H18a3 3 0 0 1 3 3v2.5" />
            <path d="M21 15.5V18a3 3 0 0 1-3 3h-2.5" />
            <path d="M8.5 21H6a3 3 0 0 1-3-3v-2.5" />
            <!-- modul QR -->
            <g fill="currentColor" stroke="none">
              <rect x="7" y="7" width="3.6" height="3.6" rx="1" />
              <rect x="13.4" y="7" width="3.6" height="3.6" rx="1" />
              <rect x="7" y="13.4" width="3.6" height="3.6" rx="1" />
              <rect x="13.4" y="13.4" width="1.6" height="1.6" rx=".5" />
              <rect x="15.4" y="15.4" width="1.6" height="1.6" rx=".5" />
            </g>
          </svg>
        </button>
      </div>
      <button data-go="#/cari"><span>🗺️</span><small>Cari</small></button>
      <button data-go="#/akun"><span>👤</span><small>Akun</small></button>
    </nav>
  </div>

  <!-- toast + modal host -->
  <div id="toast" class="toast"></div>
  <div id="modalHost"></div>

  <!-- boot.js lebih dulu: kerangka halaman tampil sebelum modul app selesai dimuat -->
  <script type="module" src="js/boot.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
