# ============================================================
# Netlify — situs statis + function pembayaran.
#
# Tanpa 'command': proyek ini vanilla ES modules, tidak ada build step.
# Pengaturan di berkas ini MENANG atas pengaturan di dasbor Netlify, supaya
# konfigurasinya tercatat di repo dan bukan hanya di satu tab peramban.
# ============================================================
[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

  # Pemindai rahasia Netlify menggagalkan build kalau nilai sebuah env var yang
  # ditandai "secret" ditemukan di dalam repo. FB_PROJECT_ID ("quparkir") dan
  # ALLOWED_ORIGIN (URL publik situs) BUKAN rahasia — keduanya muncul ratusan
  # kali di repo secara sah, mulai dari .firebaserc sampai tiap tag <link> di
  # HTML. Menandainya rahasia di dasbor membuat pemindai menemukan "temuan"
  # yang semuanya wajar, lalu build mati.
  #
  # Yang BENAR-BENAR rahasia hanya FB_PRIVATE_KEY dan MIDTRANS_SERVER_KEY, dan
  # keduanya sengaja TIDAK dicantumkan di sini — biar tetap dipindai. Kalau
  # suatu saat salah satu dari keduanya bocor ke dalam repo, build harus mati.
  SECRETS_SCAN_OMIT_KEYS = "FB_PROJECT_ID,ALLOWED_ORIGIN,FB_CLIENT_EMAIL,MIDTRANS_CLIENT_KEY,MIDTRANS_IS_PRODUCTION"

# Jaring pengaman: sapu order 'pending' yang webhook-nya tidak pernah sampai.
