# ============================================================
# Netlify — situs statis + function pembayaran.
#
# Tanpa 'command': proyek ini vanilla ES modules, tidak ada build step.
# Pengaturan di berkas ini MENANG atas pengaturan di dasbor Netlify, supaya
# konfigurasinya tercatat di repo dan bukan hanya di satu tab peramban.
# ============================================================
[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # WAJIB 22, jangan diturunkan ke 20.
  #
  # firebase-admin → jwks-rsa (CommonJS) → jose@6 (ESM-only). require() atas
  # modul ESM baru didukung Node 20.19+, dan runtime "20" milik Netlify masih
  # 20.x yang lebih tua: seluruh function yang menyentuh firebase-admin/auth
  # mati dengan ERR_REQUIRE_ESM begitu dipanggil. Ini sudah terjadi sungguhan
  # pada deploy 25 Agu 2026 — /payment-config membalas "This function has
  # crashed", padahal /hello (yang tidak menyentuh Auth) baik-baik saja.
  NODE_VERSION = "22"

  # Pemindai rahasia Netlify menggagalkan build kalau nilai sebuah env var yang
  # ditandai "secret" ditemukan di dalam repo. FB_PROJECT_ID ("quparkir") dan
  # ALLOWED_ORIGIN (URL publik situs) BUKAN rahasia — keduanya muncul ratusan
  # kali di repo secara sah, mulai dari .firebaserc sampai tiap tag <link> di
  # HTML. Menandainya rahasia di dasbor membuat pemindai menemukan "temuan"
  # yang semuanya wajar, lalu build mati.
  #
  # Yang BENAR-BENAR rahasia hanya FB_PRIVATE_KEY dan MIDTRANS_SERVER_KEY, dan
  # keduanya sengaja TIDAK dicantumkan di sini — biar tetap dipindai. Kalau
  # suatu saat salah satu dari keduanya bocor ke dalam repo, build harus mati.
  SECRETS_SCAN_OMIT_KEYS = "FB_PROJECT_ID,ALLOWED_ORIGIN,FB_CLIENT_EMAIL,MIDTRANS_CLIENT_KEY,MIDTRANS_IS_PRODUCTION,MIDTRANS_ENABLED"

# ============================================================
# SAKLAR PEMBAYARAN GATEWAY
#
# Jalur Midtrans hidup HANYA kalau env var MIDTRANS_ENABLED bernilai "true".
# Nilainya TIDAK diset di sini dengan sengaja — saklar harus bisa dimatikan
# dari dasbor Netlify dalam hitungan detik, tanpa push dan tanpa deploy ulang:
#
#   netlify env:set MIDTRANS_ENABLED true      # nyalakan
#   netlify env:unset MIDTRANS_ENABLED         # matikan
#
# Selama mati, create-payment membalas 503 dan klien mundur sendiri ke QRIS
# merchant. midtrans-webhook TETAP hidup — uang yang telanjur dibayar tetap
# harus dicatat.
#
# MIDTRANS_ENABLED ikut dikecualikan dari secrets scanning di atas: nilainya
# hanya "true"/"false" dan tertulis di dokumentasi repo ini, jadi kalau ikut
# dipindai, build mati oleh temuan yang semuanya wajar.
# ============================================================

# Jaring pengaman: sapu order 'pending' yang webhook-nya tidak pernah sampai.
# Jadwalnya sekarang dideklarasikan DI DALAM netlify/functions/reconcile.js
# (Functions API v2: `export const config = { schedule: "@hourly" }`) dan masih
# dikomentari di sana. Blok [functions."reconcile"] di bawah sengaja dibiarkan
# mati supaya tidak ada dua sumber kebenaran untuk satu jadwal.
# [functions."reconcile"]
#   schedule = "@hourly"
